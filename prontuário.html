<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Novo Atendimento - NAEI</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header>

    <div class="brand-section">

        <div class="brand-icon">
            <svg viewBox="0 0 24 24">
                <path d="M12 11c1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3 1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5-2.33 0-7 1.17-7 3.5V19h14v-2.5z"/>
            </svg>
        </div>

        <div>
            <div class="brand-title">
                Núcleo de Apoio Educacional e Inclusivo
            </div>

            <div class="brand-subtitle">
                Prontuários compartilhados
            </div>
        </div>

    </div>


    <div class="user-section">

        <div class="user-info">

            <div class="user-name" id="user-name">
                Carregando...
            </div>

            <div class="user-role" id="user-role">
                Carregando...
            </div>

        </div>

        <button
            class="logout-btn"
            id="logout-btn"
            title="Sair">

            <svg viewBox="0 0 24 24">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                <polyline points="16 17 21 12 16 7"></polyline>
                <line x1="21" y1="12" x2="9" y2="12"></line>
            </svg>

        </button>

    </div>

</header>


<main>

    <div class="page-header">

        <div>

            <button
                type="button"
                class="back-button"
                id="back-button">

                ← Voltar para ficha

            </button>

            <h1>Novo atendimento</h1>

            <p id="student-name">
                Carregando aluno...
            </p>

        </div>

    </div>


    <section class="form-card">

        <form id="record-form">


            <!-- DATA -->

            <div class="form-group">

                <label for="attendance-date">
                    Data do atendimento
                </label>

                <input
                    type="date"
                    id="attendance-date"
                    required>

            </div>


            <!-- TIPO -->

            <div class="form-group">

                <label for="record-type">
                    Tipo de atendimento
                </label>

                <select
                    id="record-type"
                    required>

                    <option value="">
                        Selecione
                    </option>

                    <option value="Atendimento">
                        Atendimento
                    </option>

                    <option value="Avaliação">
                        Avaliação
                    </option>

                    <option value="Devolutiva">
                        Devolutiva
                    </option>

                    <option value="Reunião">
                        Reunião
                    </option>

                    <option value="Orientação">
                        Orientação
                    </option>

                    <option value="Outro">
                        Outro
                    </option>

                </select>

            </div>


            <!-- REGISTRO -->

            <div class="form-group">

                <label for="record-content">
                    Registro do atendimento
                </label>

                <textarea
                    id="record-content"
                    rows="8"
                    placeholder="Descreva o atendimento realizado..."
                    required></textarea>

            </div>


            <!-- OBSERVAÇÕES -->

            <div class="form-group">

                <label for="record-observations">
                    Observações
                </label>

                <textarea
                    id="record-observations"
                    rows="5"
                    placeholder="Registre observações relevantes..."></textarea>

            </div>


            <!-- RECOMENDAÇÕES -->

            <div class="form-group">

                <label for="record-recommendations">
                    Recomendações
                </label>

                <textarea
                    id="record-recommendations"
                    rows="5"
                    placeholder="Registre orientações ou recomendações..."></textarea>

            </div>


            <div
                id="record-message"
                class="form-message">
            </div>


            <div class="form-actions">

                <button
                    type="button"
                    class="cancel-button"
                    id="cancel-button">

                    Cancelar

                </button>

                <button
                    type="submit"
                    class="new-student-btn"
                    id="save-record">

                    Salvar atendimento

                </button>

            </div>


        </form>

    </section>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/supabase.js"></script>

<script src="js/prontuario.js"></script>

</body>

</html>
