<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Aluno - NAEI</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header>

    <div class="brand-section">

        <div class="brand-icon">
            <svg viewBox="0 0 24 24">
                <path d="M12 11c1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3 1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5z"/>
            </svg>
        </div>

        <div>
            <div class="brand-title">
                Núcleo de Apoio Educacional e Inclusivo
            </div>

            <div class="brand-subtitle">
                Prontuários compartilhados
            </div>
        </div>

    </div>

    <div class="user-section">

        <div class="user-info">

            <div class="user-name" id="user-name">
                Carregando...
            </div>

            <div class="user-role" id="user-role">
                Carregando...
            </div>

        </div>

        <button class="logout-btn" id="logout-btn" title="Sair">

            <svg viewBox="0 0 24 24">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                <polyline points="16 17 21 12 16 7"></polyline>
                <line x1="21" y1="12" x2="9" y2="12"></line>
            </svg>

        </button>

    </div>

</header>


<main>

    <div class="page-header">

        <div>

            <button
                type="button"
                class="back-button"
                onclick="window.location.href='dashboard.html'">

                ← Voltar para alunos

            </button>

            <h1 id="page-title">
                Novo aluno
            </h1>

            <p>
                Cadastre os dados básicos do aluno.
            </p>

        </div>

    </div>


    <section class="form-card">

        <form id="student-form">

            <div class="form-grid">

                <div class="form-group form-full">

                    <label for="full-name">
                        Nome completo
                    </label>

                    <input
                        type="text"
                        id="full-name"
                        placeholder="Digite o nome completo"
                        required>

                </div>


                <div class="form-group">

                    <label for="birth-date">
                        Data de nascimento
                    </label>

                    <input
                        type="date"
                        id="birth-date">

                </div>


                <div class="form-group">

                    <label for="diagnosis">
                        Diagnóstico
                    </label>

                    <select id="diagnosis">

                        <option value="">
                            Nenhum diagnóstico informado
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="diagnosis-level">
                        Nível / especificação
                    </label>

                    <input
                        type="text"
                        id="diagnosis-level"
                        placeholder="Ex.: nível 1">

                </div>


                <div class="form-group form-full">

                    <label for="student-notes">
                        Observações
                    </label>

                    <textarea
                        id="student-notes"
                        rows="5"
                        placeholder="Informações importantes sobre o aluno..."></textarea>

                </div>

            </div>


            <div
                id="form-message"
                class="form-message">
            </div>


            <div class="form-actions">

                <button
                    type="button"
                    class="cancel-button"
                    onclick="window.location.href='dashboard.html'">

                    Cancelar

                </button>

                <button
                    type="submit"
                    class="new-student-btn"
                    id="save-student">

                    Salvar aluno

                </button>

            </div>

        </form>

    </section>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/supabase.js"></script>

<script src="js/aluno.js"></script>

</body>

</html>
